<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PyroCast · 모델 선택</title>

<style>
*{box-sizing:border-box}body{margin:0;background:#142936;color:#e7eef3;font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}header{height:64px;display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #486071}header strong{color:#65d6ed}select,button,a.button{font:inherit;color:inherit;background:#234455;border:1px solid #617d8d;border-radius:6px;padding:7px 12px}button,a.button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}select{max-width:65vw}main{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 64px)}#stage{position:relative;min-width:0;min-height:300px}canvas{display:block;width:100%;height:100%}#controls{position:absolute;z-index:2;top:14px;left:14px;display:flex;gap:5px;flex-wrap:wrap;right:8px}#selection{position:absolute;bottom:16px;left:16px;background:#102331e8;padding:8px 14px;max-width:80%;pointer-events:none}aside{padding:20px;overflow:auto;border-left:1px solid #486071;background:#182e3c}h1{font-size:20px;margin:0 0 10px}.badge{display:inline-block;padding:3px 8px;border:1px solid #60808f;border-radius:4px;color:#bce5ed;margin-bottom:12px}.scan{color:#ffd38d;border-color:#b68a54}#counts{color:#b8cbd6;margin:8px 0 18px}#reason{color:#d6bd90}#note{white-space:pre-line;color:#b4c6cf;font-size:12px}#links{display:grid;gap:8px;margin:18px 0}a{color:#9ee9f4;text-decoration:none}#error{white-space:pre-wrap;color:#ffae9a}#review{font-size:12px}#review table{width:100%;border-collapse:collapse}#review td,#review th{border-bottom:1px solid #3d5564;padding:5px}#review select{max-width:130px}#review button{font-size:11px;padding:4px}#review details{margin-top:16px}#review summary{cursor:pointer}#loading{position:absolute;top:65px;left:20px;pointer-events:none}footer{font-size:12px;color:#9db4c1;margin-top:24px}@media(max-width:820px){header{height:auto;flex-wrap:wrap;padding:8px}main{height:auto;display:flex;flex-direction:column}#stage{height:60vh}aside{border-left:0;border-top:1px solid #486071}#controls button{padding:5px}#review{max-height:45vh;overflow:auto}}
#simulation label{display:block;margin:8px 0}#simulation select{display:block;width:100%;max-width:100%}#simNote,#simStatus{font-size:12px}#simJobs button{display:block;font-size:12px;width:100%;margin:4px 0}#playbackBar{position:absolute;bottom:10px;left:12px;right:12px;padding:10px;background:#102331ed;border-radius:8px;z-index:3}#playbackBar input[type=range]{width:40%}#playbackBar label{margin-left:8px}#playbackBar #cfPlumeLegend{display:none}#simReadout{font-size:12px}#selection{bottom:110px}
</style></head><body>
<header><strong>PyroCast</strong><select id="model" aria-label="건물 선택"></select><span>작업 모델 보관함</span></header>
<main><section id="stage"><div id="controls"><select id="floor" aria-label="표시 층"></select><button id="iso">비스듬히</button><button id="top">위에서</button><button id="fit">전체 맞춤</button><label><input id="walls" type="checkbox" checked>벽 투시</label><label><input id="openings" type="checkbox" checked>문·창</label></div><div id="loading"></div><div id="selection">실을 클릭하면 선택됩니다</div></section>
<aside><h1 id="name"></h1><span id="source" class="badge"></span><div id="counts"></div><button id="run" disabled>시뮬레이션 실행</button><p id="reason"></p><div id="links"></div><p id="note"></p><div id="review"></div><pre id="error"></pre><footer>과거 원본·계산 결과는 보존합니다.</footer></aside></main>
<script type="module" src="/models/viewer.js"></script></body></html>
