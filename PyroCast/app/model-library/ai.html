<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 연결</title><style>
body{margin:0;padding:24px;background:#163345;color:#eaf3f8;font:14px/1.6 system-ui}h1{font-size:19px;margin:0 0 16px}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:9px;background:#234357;border:1px solid #7292a3;border-radius:5px;color:inherit;font:inherit}button{padding:8px 12px;background:#21758c;color:inherit;border:1px solid #72b9cf;border-radius:5px;cursor:pointer}button:disabled{opacity:.5;cursor:default}small{color:#b6cbd7}#status{white-space:pre-wrap}button+button{margin-left:8px}
</style><h1>AI API 연결</h1><form id="form" autocomplete="off"><label>API 주소<input id="url" type="url" placeholder="https://…/v1" required maxlength="500"></label><label>모델<input id="model" placeholder="사용할 모델 ID" required maxlength="150"></label><label>API 키<input id="key" type="password" autocomplete="off" required maxlength="4096" spellcheck="false"></label><button id="connect" type="submit">연결 확인·사용</button><button id="disconnect" type="button" disabled>연결 해제</button></form><p id="status" role="status">연결 확인 중…</p><small>연결 확인 시 짧은 API 요청 1회를 보냅니다.<br>키는 서버 메모리에만 유지됩니다. 새로고침 후에도 연결되며 서버를 종료하면 다시 입력해야 합니다.<br>스캔 판독에는 이미지 입력을 지원하는 모델이 필요합니다.</small><script type="module" src="/models/ai.js"></script></html>
