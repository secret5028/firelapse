<style>

<div id="v"></div>

<h2>보기</h2>

<label><input id="gl" type="checkbox" checked> 유리</label>

<button id="wsave">창 설정 저장</button>
<h2>수직 공간</h2>
<label><input id="sh" type="checkbox" checked> 계단·승강기·램프 표시</label>
<label><input id="show_stair" type="checkbox" checked> 계단·계단참</label><label><input id="show_elev" type="checkbox" checked> 승강기·승강장 문</label><label><input id="show_ramp" type="checkbox" checked> 차량 램프</label><label><input id="show_anchor" type="checkbox"> 원본 대조 경계(빨강: 기호 / 청록: 실)</label><label>램프 경사 <input id="ramp_slope" type="range" min="0" max="25" step="1" value="10"><span id="ramp_value">10%</span></label><label><input id="ramp_reverse" type="checkbox"> 램프 상승 방향 반전</label><p style="font-size:11px">램프는 확인된 곡선 구간입니다. 경사·상승 방향은 표시용 가정이며 상단 연결층은 미확정입니다.</p><h2>검사(공리)</h2><div id="ck"></div></div>

<script type="module">
import * as THREE from 'three';

const B=await (await fetch('building.json')).json();
function ceilStateDefault(f){const r=f.ceil_rule||{};return Math.min(f.h-0.3,Math.max(r.min_h||2.4,f.h-(r.plenum||1.0)))}
const el=document.getElementById('v');

const S=new THREE.Scene();

S.add(new THREE.HemisphereLight(0xffffff,0x666666,1.6));const dl=new THREE.DirectionalLight(0xffffff,1.4);dl.position.set(40,-60,90);S.add(dl);
const mat={wall:new THREE.MeshLambertMaterial({color:0x8a8a8a,transparent:true}),door_head:new THREE.MeshLambertMaterial({color:0x3fa34d,transparent:true}),
win_low:new THREE.MeshLambertMaterial({color:0xe08a1e,transparent:true}),win_head:new THREE.MeshLambertMaterial({color:0xe08a1e,transparent:true}),
glass:new THREE.MeshLambertMaterial({color:0x7fc8ff,transparent:true,opacity:0.35,depthWrite:false}),slab:new THREE.MeshLambertMaterial({color:0xcfcac0}),beam:new THREE.MeshLambertMaterial({color:0x8b5a2b,transparent:true}),ceil:new THREE.MeshLambertMaterial({color:0xf2e6b8,transparent:true,opacity:0.35,depthWrite:false,side:THREE.DoubleSide})};

const groups=[],labels=[],glassM=[],ceilM=[],ceilState=[];let maxX=0,maxY=0,maxZ=0;
B.floors.forEach((f,i)=>{const G=new THREE.Group();G.userData.z=f.z;G.position.z=f.z;G.name=f.name;
  const sl=ext(f.render_slab||f.slab,-0.2,0,mat.slab);if(sl){sl.name=f.name+'_slab';G.add(sl)}
  const beamMs=[];for(const b of f.bands){const m=ext(b.polys,b.z0,b.z1,mat[b.kind]);if(m){m.name=f.name+'_'+b.kind;G.add(m);if(b.kind==='beam')beamMs.push(m)}}
  // 천장 마감(반자): 기본은 규칙값, 층별로 켜기/끄기·높이 변경. 보는 반자 없거나 반자보다 아래로 내려올 때만 보임
  const st={on:f.ceil_h!=null,h:f.ceil_h!=null?f.ceil_h:Math.max((f.ceil_rule&&f.ceil_rule.min_h)||2.4,f.h-((f.ceil_rule&&f.ceil_rule.plenum)||1.0)),mesh:null,beams:[]};
  if(f.ceiling&&f.ceiling.length){const c=ext(f.render_ceiling||f.ceiling,0,0.03,mat.ceil);if(c){c.name=f.name+'_ceiling';G.add(c);ceilM.push(c);st.mesh=c}}
  st.beams=beamMs;ceilState.push(st);
  // 창: 종류 구분 없이 단일 처리(층별 창대·창머리 높이). 창마다 개방·파손률 변수(0%=온전, 100%=완전 개방·파손)
  for(const o of f.openings){if(o.kind!=='window'&&o.kind!=='window_inner')continue;
    const ps=o.polys.filter(p=>p.length>=3).map(p=>({o:p,h:[]}));const g=ext(ps,f.glass.z0,f.glass.z1,mat.glass.clone());
    if(g){g.name=f.name+'_'+o.id;G.add(g);glassM.push(g);g.userData.win={floor:f.name,id:o.id,pct:0,mesh:g}}}
  for(const r of f.rooms){const tg=r.tags.find(t=>tagCol[t]);const c=tg?tagCol[tg]:new THREE.Color().setHSL((parseInt(r.id.slice(1))*0.137)%1,0.45,dark?0.35:0.8).getHex();
    const geo=new THREE.ShapeGeometry((r.render_polys||r.polys).map(shp));geo.translate(0,0,0.02);const m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide}));m.name=f.name+'_'+r.id;G.add(m);
    if(!(r.names&&r.names.length)&&r.area<8)continue;
    const d=document.createElement('div');d.className='lb';d.textContent=(r.names&&r.names.length?r.names[r.names.length>1?1:0]:r.id)+' '+r.area+'㎡';
    const o=new CSS2DObject(d);o.position.set(r.c[0],r.c[1],0.3);G.add(o);labels.push(o)}
  for(const p of f.slab)for(const[x,y]of p.o){maxX=Math.max(maxX,x);maxY=Math.max(maxY,y)}maxZ=Math.max(maxZ,f.z+f.h);
  S.add(G);groups.push(G);
  const lb=document.createElement('label');lb.innerHTML=`<input type=checkbox checked> ${f.name} (${f.use}, 바닥 ${f.z.toFixed(2)}m, 층고 ${f.h.toFixed(2)}m, 반자 ${f.ceil_h?f.ceil_h.toFixed(2)+'m':'없음'}, 보 ${({exposed:'노출',above_ceiling:'반자 위(숨김)',none:'-'})[f.beams]||'-'}, 실 ${f.rooms.length}, 개구부 ${f.openings.length})`;
  lb.querySelector('input').onchange=e=>{G.visible=e.target.checked};document.getElementById('fl').appendChild(lb);
  const cc=document.createElement('label');cc.style.paddingLeft='18px';cc.innerHTML=`<input type=checkbox ${f.ceil_h!=null?'checked':''}> 천장 마감 <input type=number step=0.1 min=2.1 max=${f.h.toFixed(1)} value=${(f.ceil_h!=null?f.ceil_h:0).toFixed(2)} style="width:60px">m`;
  const [cb,ci]=cc.querySelectorAll('input');const k=i;
  if(f.ceil_h==null)ci.value=(Math.round(ceilStateDefault(f)*100)/100).toFixed(2);
  cb.onchange=()=>{ceilState[k].on=cb.checked;applyCeil()};ci.oninput=()=>{ceilState[k].h=Math.min(f.h-0.05,Math.max(2.1,parseFloat(ci.value)||2.1));applyCeil()};
  document.getElementById('fl').appendChild(cc);
  const ck=document.getElementById('ck');for(const c of f.checks){const d=document.createElement('div');d.className='ck';d.textContent=`${f.name} ${c.rule} ${c.id||''} ${c.note||''}`;ck.appendChild(d)}});
// ---- 문짝: 경첩 기준, 도면 호 방향으로 회전. 0%=닫힘, 100%=도면에 그려진 열린 위치 ----
const leafMat=new THREE.MeshLambertMaterial({color:0x2e7d32}),leafSel=new THREE.MeshLambertMaterial({color:0xc62828});
const leaves=[];
const ang=(a,b)=>Math.atan2(b[1]-a[1],b[0]-a[0]);
function dAng(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function swingGuidePoints(L){const c=ang(L.hinge,L.closed),o=ang(L.hinge,L.open),start=L.open2?o:c;
  const span=L.open2?dAng(o,c)+dAng(c,ang(L.hinge,L.open2)):dAng(c,o);
  return Array.from({length:49},(_,i)=>new THREE.Vector3(L.hinge[0]+L.r*Math.cos(start+span*i/48),L.hinge[1]+L.r*Math.sin(start+span*i/48),0.035))}
B.floors.forEach((f,i)=>{const G=groups[i];for(const o of f.openings){(o.leaves||[]).forEach((L,j)=>{
  const w=L.r,h=Math.max(0.5,(o.door_h||f.door_h||2.1)-0.02),t=0.045;
  const piv=new THREE.Group();piv.position.set(L.hinge[0],L.hinge[1],0.01);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,t,h),leafMat);m.position.set(w/2,0,h/2);piv.add(m);G.add(piv);
  const a0=ang(L.hinge,L.closed),a1=ang(L.hinge,L.open),a2=L.open2?ang(L.hinge,L.open2):null;
  const guide=new THREE.Line(new THREE.BufferGeometry().setFromPoints(swingGuidePoints(L)),new THREE.LineBasicMaterial({color:0x198346}));G.add(guide);
  const st={floor:f.name,id:o.id,j,kind:L.kind,piv,guide,mesh:m,a0,d1:dAng(a0,a1),d2:a2==null?null:dAng(a0,a2),pct:0,cur:0,rev:false,swing_into:o.swing_into};
  m.userData.leaf=st;leaves.push(st)})}});
function leafTarget(s){const d=(s.rev&&s.d2!=null)?s.d2:s.d1;return s.a0+d*s.pct/100}
leaves.forEach(s=>{s.cur=leafTarget(s);s.piv.rotation.z=s.cur});
let selLeaf=null;
function pick(e){const r=R.domElement.getBoundingClientRect();const m=new THREE.Vector2((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  const rc=new THREE.Raycaster();rc.setFromCamera(m,C);const hit=rc.intersectObjects(leaves.map(s=>s.mesh).filter(x=>visibleByName(x)),false)[0];
  if(selLeaf)selLeaf.mesh.material=leafMat;selLeaf=hit?hit.object.userData.leaf:null;
  const one=document.getElementById('done'),l1=document.getElementById('donel'),l2=document.getElementById('ddirl');
  if(selLeaf){selLeaf.mesh.material=leafSel;l1.style.display='';l2.style.display=selLeaf.d2!=null?'':'none';one.value=selLeaf.pct;document.getElementById('donev').textContent=selLeaf.pct+'%';document.getElementById('ddir').checked=selLeaf.rev;
    document.getElementById('dsel').textContent=`${selLeaf.floor} ${selLeaf.id} 문짝${selLeaf.j+1} · ${selLeaf.kind==='double_acting'?'양방향문':'여닫이'} · 열리는 쪽 ${selLeaf.swing_into||'?'}`}
  else{l1.style.display='none';l2.style.display='none';document.getElementById('dsel').textContent='문짝을 클릭하면 개별 조절'}}
let down=null;R.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
R.domElement.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<4)pick(e)});
document.getElementById('dall').oninput=e=>{const p=+e.target.value;document.getElementById('dallv').textContent=p+'%';leaves.forEach(s=>s.pct=p);if(selLeaf){document.getElementById('done').value=p;document.getElementById('donev').textContent=p+'%'}};
document.getElementById('done').oninput=e=>{if(!selLeaf)return;const p=+e.target.value;document.getElementById('donev').textContent=p+'%';
  // 양개문: 짝 문짝도 같은 값
  leaves.filter(s=>s.floor===selLeaf.floor&&s.id===selLeaf.id).forEach(s=>s.pct=p)};

document.getElementById('dsave').onclick=()=>{const o={};leaves.forEach(s=>{o[s.floor]=o[s.floor]||{};o[s.floor][s.id]={open_pct:s.pct,reverse:s.rev,kind:s.kind,swing_into:s.swing_into}});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));a.download='door_settings.json';a.click()};

// ---- 창 개방·파손률: 유리 불투명도·색으로 표시, 저장(연기 모델 입력) ----
const wins=glassM.map(m=>m.userData.win).filter(Boolean);
function paintWin(w){const p=w.pct/100;w.mesh.material.opacity=0.35*(1-p)+0.05;w.mesh.material.color.setHex(p>0?0xff7a59:0x7fc8ff)}
let selWin=null;
document.getElementById('wall').oninput=e=>{const p=+e.target.value;document.getElementById('wallv').textContent=p+'%';wins.forEach(w=>{w.pct=p;paintWin(w)})};
document.getElementById('wone').oninput=e=>{if(!selWin)return;selWin.pct=+e.target.value;document.getElementById('wonev').textContent=selWin.pct+'%';paintWin(selWin)};

</style><button id="toggle">송수구 · 방수 구역 · 압력</button><section id="panel" hidden aria-label="송수구 계통 검토"><div class="row"><h2>송수구 연결 · 필요 송수압</h2><button id="close" style="margin-left:auto">닫기</button></div><p class="note" id="building"></p><p class="note">송수구 → 배관 → 방수 말단을 추적합니다. 통수 연결은 밸브가 열린 조건이며 실제 방수 작동을 보증하지 않습니다.</p><p class="warn" id="sourceNote"></p><label>송수구 <select id="inlet"></select></label><label><input id="show3d" type="checkbox" checked> 3D 연결 표시</label><div id="trace"></div><svg id="map" viewBox="0 0 600 235" role="img" aria-label="송수구 연결 개략도"></svg><h3>동시 방수 말단</h3><div id="outlets"></div><div id="result" aria-live="polite"></div><label><input id="reviewed" type="checkbox"> 연결·밸브 상태와 단일 공급 계산 범위를 검토함</label><p class="note">필요 송수압 = 말단 필요 압력 + 높이차 + 배관·밸브 손실. 요구 유량을 고정한 정상상태 검토값이며, 소방차 펌프 설정압이 아닙니다. 송수구 앞 수관, 노즐·호스 손실도 필요한 경우 별도 구간으로 등록하세요.</p><details><summary>계통 편집 · 제원 입력</summary><p class="note">모든 좌표·높이는 동일 기준의 m, 관경은 호칭경이 아닌 내경 mm입니다. 선의 화면 길이를 실제 배관 길이로 대체하지 않습니다. 말단은 실제 헤드·방수구를 각각 등록하세요.</p><div class="row"><button id="addInlet">송수구 추가</button><button id="addJunction">분기점 추가</button><button id="addOutlet">방수 말단 추가</button></div><div class="scroll" id="nodes"></div><button id="addPipe">배관 연결 추가</button><div class="scroll" id="pipes"></div><p class="note">방향 ‘시작→끝’은 역류 금지입니다. 닫힌 밸브는 연결에서 제외합니다. ΣK는 배관 구간에 속한 이음쇠·밸브 손실계수의 합이며 마찰 C와 서로 다릅니다. 미확인 값은 빈칸으로 두세요.</p></details><details><summary>저장 · 가져오기 · 계산 근거</summary><p>건물별로 자동 저장합니다. 다른 건물의 계통 파일은 가져오지 않습니다.</p><button id="export">계통 파일 저장</button><button id="import">계통 파일 가져오기</button><input hidden type="file" id="file" accept=".json"><p class="note">물 기준 Hazen–Williams 마찰 손실, ΣK·v²/2g 국부 손실, 9.80665 kPa/m 높이차를 사용합니다. 자동 개방 헤드의 압력에 따른 유량 분배, 환상·병렬 배관, 복수 공급, 펌프·감압밸브 해석은 미지원입니다. 이런 계통은 계산값 대신 확인 항목을 표시합니다. 법정 기준값·허용 최고 압력·급수 능력의 적합 판정은 포함하지 않습니다.</p><a href="https://usepa.github.io/EPANET2.2/3_network_model.html" target="_blank" rel="noopener">계산식 참고: US EPA EPANET 매뉴얼</a></details><p id="saved" role="status"></p></section>`;

function draw(tr){
 const nodes=net.nodes, map=new Map();if(!nodes.length){$('map').innerHTML='<text x="170" y="115">등록된 송수구와 배관 없음</text>';return;}
 // Schematic X/Z projection; use a layout when coordinates are incomplete.
 const coords=nodes.map((n,i)=>Number.isFinite(n.x)&&Number.isFinite(n.z)?[n.x+(n.y||0)*.35,n.z-(n.y||0)*.5]:[i%6*15,Math.floor(i/6)*15]);
 const xs=coords.map(p=>p[0]),zs=coords.map(p=>p[1]),minX=Math.min(...xs),minZ=Math.min(...zs),scale=Math.min(520/Math.max(1,Math.max(...xs)-minX),165/Math.max(1,Math.max(...zs)-minZ));
 nodes.forEach((n,i)=>map.set(n.id,[35+(coords[i][0]-minX)*scale,35+(coords[i][1]-minZ)*scale]));
 $('map').innerHTML=net.pipes.map(p=>{const a=map.get(p.from),b=map.get(p.to);if(!a||!b)return '';return `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${tr.pipes.includes(p.id)?'#ff566d':'#466073'}" stroke-width="${tr.pipes.includes(p.id)?4:2}" ${p.state!=='open'?'stroke-dasharray="5 5"':''}/>`;}).join('')+nodes.map(n=>{const [x,y]=map.get(n.id);return `<g data-node="${esc(n.id)}"><circle cx="${x}" cy="${y}" r="${n.type==='inlet'?9:net.active.includes(n.id)?6:n.type==='junction'?1.5:3}" fill="${n.id===net.inlet?'#fff1a3':net.active.includes(n.id)?'#63e5db':tr.nodes.includes(n.id)?'#ff566d':'#6a8091'}"/>${nodes.length<30||n.type==='inlet'||net.active.includes(n.id)?`<text x="${x+10}" y="${y-8}">${esc(n.name)}</text>`:''}<title>${esc(n.name)}</title></g>`;}).join('');
}

function hydraulicPipeRadius(p){

}
// Shared overlay for reviewed building viewers; positions are world metres.
// Preserve only the supply path to the selected floor, not every lower-floor branch.
function hydraulicFloorPipeIds(network,floorValue){
 const result=new Set(),nodes=new Map(network.nodes.map(n=>[n.id,n]));
 const root=network.nodes.find(n=>n.id===network.visualRootId)||network.nodes.find(n=>n.id===network.inlet&&n.type==='inlet')||network.nodes.find(n=>n.type==='inlet');
 const floor=floorValue&&floorValue!=='all'?Number(floorValue.split('|').pop()):null;
 const allowed=network.pipes.filter(p=>p.state==='open'&&nodes.has(p.from)&&nodes.has(p.to));
 for(const p of network.pipes.filter(p=>nodes.has(p.from)&&nodes.has(p.to)))if(floor===null||(nodes.get(p.from).floor===floor&&nodes.get(p.to).floor===floor))result.add(p.id);
 if(!root||floor===null)return result;

  const fingerprint=JSON.stringify(page.fireFacilities.pipes.map(b=>b.points));if(n.pipeReview?.fingerprint===fingerprint)page.pipeReview=structuredClone(n.pipeReview);if(!page.pipeReview||page.pipeReview.fingerprint!==fingerprint){if(page.pipeReview)page.previousPipeReview=page.pipeReview;page.pipeReview={fingerprint,assignments:{},history:[]};}
  if(!document.getElementById('openPipeElimination')){const b=document.createElement('button');b.id='openPipeElimination';b.textContent='배관 소거 판독';b.onclick=open;document.getElementById('fireFacilityPanel')?.append(b);}apply();
 }};
})();

// PARTIAL_READING_NOTICE

window.addEventListener('hydraulic-selection',e=>{
 const a=e.detail.network.readingAssessment;let box=document.getElementById('partialReadingNotice');
 if(!a){if(box)box.remove();return;}
 if(!box){box=document.createElement('section');box.id='partialReadingNotice';box.setAttribute('role','status');box.setAttribute('aria-live','polite');box.style.cssText='border:1px solid #d69c42;border-radius:7px;padding:12px;margin:12px 0;background:#49391f;color:#ffe1a0;font-size:12px;line-height:1.6';document.getElementById('fireFacilityPanel')?.prepend(box);}
 box.replaceChildren();const title=document.createElement('strong');title.textContent=a.title;box.append(title);
 for(const text of [a.message,a.remaining,a.nextAction]){const p=document.createElement('p');p.textContent=text;box.append(p);}
 const manual=document.getElementById('openPipeElimination');if(manual)manual.remove();const dialog=document.getElementById('pipeEliminationDialog');if(dialog?.open)dialog.close();
});

window.installOperations(THREE,legacyRoot,C,R.domElement,S);
window.installHydraulicView(THREE,legacyRoot,C,R.domElement);
const facilities=document.createElement('section');facilities.innerHTML='<h2>소방 설비·계통</h2><button id="legacyNetwork">송수구 · 연결 구역 · 압력</button><p class="small">등록한 계통의 송수구와 연결 말단을 강조합니다. 건축 CAD에 없는 소방 배관은 자동으로 만들지 않습니다.</p>';panel.insertBefore(facilities,advanced);
$ui('legacyNetwork').onclick=()=>window.HydraulicUI.open();
const hydraulicHost=$ui('hydraulic-tool');if(hydraulicHost?.shadowRoot)hydraulicHost.shadowRoot.getElementById('toggle').hidden=true;
// Restore the same 15 m hose rule used by the original hose badge.
const routeInfo=$ui('opRouteInfo'),hoseInfo=document.createElement('p');hoseInfo.id='hoseInfo';routeInfo.after(hoseInfo);
function hoseReadout(){const route=state.operations.routes.find(r=>r.id===$ui('opRoutes').value);const distance=route?.points.slice(1).reduce((n,p,i)=>n+Math.hypot(...p.map((v,k)=>v-route.points[i][k])),0)||0;hoseInfo.textContent=route?'소요 수관 '+Math.ceil(distance/15)+'본 · 1본 15m · 여유분 제외':''}
new MutationObserver(hoseReadout).observe(routeInfo,{childList:true,characterData:true,subtree:true});hoseReadout();
// Reuse the original human geometry (1.75 m) for independent placement.
const personParts=referenceObjects.children.filter(o=>!o.isSprite&&o.position.x>4.7);
const peopleRoot=new THREE.Group();legacyRoot.add(peopleRoot);let placingPerson=false;
function refreshPeople(){
 const selector=$ui('peopleSelect'),selected=selector.value;selector.replaceChildren();
 if(!state.operations.people.length)selector.add(new Option('없음',''));
 while(peopleRoot.children.length){const g=peopleRoot.children.pop();g.traverse(o=>{o.geometry?.dispose();o.material?.dispose()});g.parent=null}
 state.operations.people.forEach((person,i)=>{selector.add(new Option('사람 '+(i+1),person.id));const group=new THREE.Group();group.position.fromArray(person.position);peopleRoot.add(group);for(const part of personParts){const mesh=part.clone();mesh.geometry=part.geometry.clone();mesh.material=part.material.clone();mesh.position.x-=5.1;mesh.position.z+=.4;group.add(mesh)}});
 if(state.operations.people.some(p=>p.id===selected))selector.value=selected;
 $ui('personDelete').disabled=!state.operations.people.length;
}
$ui('personAdd').onclick=()=>{$ui('opDone').click();placingPerson=true;$ui('personNotice').textContent='사람을 놓을 바닥이나 지면을 누르세요.'};
$ui('personDelete').onclick=()=>{state.operations.people=state.operations.people.filter(p=>p.id!==$ui('peopleSelect').value);persist();refreshPeople()};
let personDown=null;
R.domElement.addEventListener('pointerdown',e=>{if(!placingPerson)return;e.stopImmediatePropagation();personDown=[e.clientX,e.clientY];R.domElement.setPointerCapture(e.pointerId)},true);
R.domElement.addEventListener('pointerup',e=>{if(!placingPerson)return;e.stopImmediatePropagation();if(personDown&&Math.hypot(e.clientX-personDown[0],e.clientY-personDown[1])<7){const p=cadPick(e,false)||cadPick(e,true);if(p){state.operations.people.push({id:crypto.randomUUID(),position:p});placingPerson=false;persist();refreshPeople();$ui('personNotice').textContent='사람 배치 완료'}}personDown=null},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')placingPerson=false});
refreshPeople();syncLegacyFloor();
// Keep the user-facing diagnostic state readable without exposing mutable scene objects.
const previousSnapshot=window.cadViewerSnapshot;
window.cadViewerSnapshot=()=>({...previousSnapshot(),legacy:{vehicles:state.operations.vehicles.length,routes:state.operations.routes.length,fires:state.operations.fires.length,people:state.operations.people.length,hydraulics:!!window.HydraulicUI}});
updateDiagnostic();
