<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>새 건물 · FireLapse</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#102331;color:#eaf3f8;font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto}h1{font-size:21px;margin:0 0 20px}h2{font-size:15px;margin:0 0 12px}section{border:1px solid #496273;border-radius:9px;background:#163345;padding:18px;margin-bottom:16px}button,select,input{font:inherit;background:#234357;color:inherit;border:1px solid #7292a3;border-radius:5px;padding:7px 10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}input[type=number]{width:100px}button.primary{background:#21758c;border-color:#5dcbe3}label{display:inline-flex;align-items:center;gap:7px;margin:6px 12px 6px 0}small{color:#aec3d0}#drop{border:1px dashed #72b9cf;border-radius:8px;text-align:center;padding:26px 12px;cursor:pointer}#drop.over{background:#26576a;border-color:#94edff}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}.list{margin:12px 0;padding:0;list-style:none}.list li{margin:6px 0;overflow-wrap:anywhere}#fileList li{display:flex;justify-content:space-between;gap:12px}#fileList button{padding:1px 7px}#name{max-width:100%;width:280px}#nameSource{max-width:280px}#status{white-space:pre-wrap}#errors{color:#ffc3ad}#pages{overflow:auto}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #395566;padding:10px 6px;text-align:left;vertical-align:top}th{font-size:12px}td input.floor{width:70px}td input.num{width:82px}td img{width:90px;height:64px;object-fit:contain;background:white;border-radius:3px;cursor:zoom-in}td small{display:block;max-width:170px;overflow-wrap:anywhere}td .critical{color:#ffbfab}#busy{color:#81d9ec}#success{color:#9be1be}a{color:#9ae2ff}dialog{width:min(1100px,95vw);max-height:95vh;background:#163345;color:white;border:1px solid #7292a3;border-radius:9px}dialog::backdrop{background:#0009}#previewWrap{position:relative;background:white;line-height:0}#preview{display:block;width:100%;height:auto}#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}details{margin:8px 0}summary{cursor:pointer}[hidden]{display:none!important}@media(max-width:600px){body{padding:12px}section{padding:12px}label{display:flex;flex-wrap:wrap}}
</style></head><body><main><h1>새 건물 생성하기</h1><p><a href="/models/ai" target="_blank" rel="noopener">AI API 연결</a> · <span id="aiState">연결 확인 중</span></p>
<section><h2>1. CAD 도면 추가</h2><div id="drop" tabindex="0" role="button" aria-label="CAD 도면 파일 추가">CAD 도면을 여기에 끌어놓으세요<br><small>DWG · DXF / 64MB · 40개 이내</small></div><div class="actions"><button id="filesButton">파일 추가</button><button id="folderButton">폴더 추가</button></div><input id="files" type="file" multiple accept=".dwg,.dxf" hidden><input id="folder" type="file" multiple webkitdirectory hidden><ul id="fileList" class="list"></ul><button id="upload" class="primary" disabled>도면 불러오기</button></section>
<section><h2>2. 건물 이름·층 범위</h2><label>건물 이름 <input id="name" maxlength="100" placeholder="건물 이름 입력"></label><label>도면명 선택 <select id="nameSource"><option value="">직접 입력</option></select></label><div><label>최저층 <input id="lowest" placeholder="1F" size="5"></label><label>최고층 <input id="highest" placeholder="2F" size="5"></label></div><small>층 누락·심각한 형상 결측이 있으면 등록하지 않습니다. 자동보정 후 운영 화면에 연결하며, 추정 항목은 모델에 남깁니다.</small><div class="actions"><button id="generate" class="primary" disabled>자동보정 · 3D 생성</button></div></section>
<section><h2>3. 생성 결과</h2><p id="status" role="status">CAD 도면을 추가하세요.</p><ul id="errors" class="list" role="alert"></ul><div id="pages"></div><div id="success" hidden><p>건물 선택 목록에 추가됐습니다.</p><a id="openModel">생성 건물 보기</a> <button id="reviewAgain">공리·AI 다시 검토</button></div></section></main><script type="module" src="/models/new.js"></script></body></html>
